<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Trading AI - Professional</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pair {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }
        .badge-group {
            display: flex;
            gap: 8px;
        }
        .badge-long {
            background-color: #059669;
            color: #ecfdf5;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-conf {
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 6px;
        }
        .status {
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Tachimetro SVG */
        .gauge-wrapper {
            position: relative;
            width: 220px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .gauge-center-text {
            position: absolute;
            bottom: 5px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #22c55e;
            letter-spacing: 1px;
        }
        
        /* Progress Bar */
        .bar-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bar-bg {
            background: #0f172a;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Sezione Segnali Operativi (TP, SL, Leva) */
        .trade-signals-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .signal-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .signal-box-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
        }
        .signal-box-value {
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 4px;
        }

        /* Grid per TUTTE le Crypto */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 8px;
            padding-right: 4px;
        }
        .crypto-item {
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .crypto-item.active {
            border-color: #3b82f6;
            background: #1e3a8a;
        }

        .btn-ai {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>

            <div class="badge-group">

                <span id="confluence-badge" class="badge-conf">Confluence: 92%</span>
            </div>
        </div>
        <div id="price-val" class="price">$67,420.00</div>
    </div>

    <!-- Status Scanner -->
    <div class="card" style="padding: 12px;">

                <div id="scanner-status" class="status">Sincronizzato con Backend Render</div>
            </div>
        </div>
    </div>

    <!-- Tachimetro -->
    <div class="card" style="text-align: center;">

        </div>
    </div>
