<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Trading AI - Mercato Globale</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pair {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }
        .badge-group {
            display: flex;
            gap: 8px;
        }
        .badge-long {
            background-color: #059669;
            color: #ecfdf5;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-conf {
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 6px;
        }
        .status {
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Tachimetro SVG */
        .gauge-wrapper {
            position: relative;
            width: 220px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .gauge-center-text {
            position: absolute;
            bottom: 5px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #22c55e;
            letter-spacing: 1px;
        }
        
        /* Progress Bar */
        .bar-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bar-bg {
            background: #0f172a;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Grid per TUTTE le Crypto con Scroll */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 8px;
            padding-right: 4px;
        }
        .crypto-item {
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .crypto-item.active {
            border-color: #3b82f6;
            background: #1e3a8a;
        }

        .btn-ai {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

    <!-- Prezzo e Coppia -->
    <div class="card">
        <div class="header">
            <span id="pair-name" class="pair">BTC / USDT</span>
            <div class="badge-group">
                <span id="signal-badge" class="badge-long">▲ LONG</span>
                <span id="confluence-badge" class="badge-conf">Confluence: 92%</span>
            </div>
        </div>
        <div id="price-val" class="price">$67,420.00</div>
    </div>

    <!-- Status Scanner -->
    <div class="card" style="padding: 12px;">
        <div style="display:flex; align-items:center; gap:8px;">
            <span>🔍</span>
            <div>
                <div style="font-size:11px; color:#94a3b8; font-weight:bold;">SCANNER DI MERCATO IN TEMPO REALE</div>
                <div id="scanner-status" class="status">Sincronizzato con Backend Render</div>
            </div>
        </div>
    </div>

    <!-- Tachimetro -->
    <div class="card" style="text-align: center;">
        <div style="font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 8px;">TECHNICAL RATING (IA)</div>
        
        <div class="gauge-wrapper">
            <svg width="200" height="110" viewBox="0 0 200 110">
                <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
                <path id="gauge-arc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="25"/>
                <circle id="gauge-dot" cx="160" cy="40" r="6" fill="#ffffff" />
            </svg>
            <div id="ai-rating-text" class="gauge-center-text">STRONG BUY</div>
        </div>
    </div>

    <!-- Indicatori Trend Health ed Entry Score -->
    <div class="card">
        <div class="bar-label">TREND HEALTH</div>
        <div class="bar-bg">
            <div id="trend-bar" class="bar-fill" style="width: 85%; background: #22c55e;"></div>
        </div>

        <div class="bar-label">ENTRY SCORE (IA SIGNAL)</div>
        <div class="bar-bg">
            <div id="entry-bar" class="bar-fill" style="width: 92%; background: #3b82f6;"></div>
        </div>
    </div>

    <!-- Elenco completo di tutte le Criptovalute -->
    <div class="card">
        <div style="font-size:12px; color:#94a3b8; font-weight:bold; margin-bottom:6px;">MERCATO GLOBALE (TUTTE LE CRIPTO)</div>
        <div id="grid-container" class="crypto-grid"></div>
    </div>

    <button class="btn-ai" onclick="nextMarket()">ANALIZZA CON GEMINI AI</button>
