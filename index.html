<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Trading AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pair {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }
        .badge {
            background-color: #059669;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }
        .status {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span id="pair-name" class="pair">CARICAMENTO...</span>
            <span id="signal-badge" class="badge">ANALISI</span>
        </div>
        <div id="price-val" class="price">$0.0000</div>
        <div id="scanner-status" class="status">🔍 Scansione mercato globale in corso...</div>
    </div>

    <div class="card">
        <h3>TECHNICAL RATING (AI)</h3>
        <p id="ai-rating" style="font-size: 20px; font-weight: bold; color: #4ade80;">Elaborazione trend...</p>
        <div style="background: #334155; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 10px;">
            <div id="progress-bar" style="background: #38bdf8; width: 50%; height: 100%; transition: width 0.5s;"></div>
        </div>
    </div>

    <button class="btn" onclick="fetchMarketData()">FORZA AGGIORNAMENTO MERCATO</button>

    <script>
        const BACKEND_URL = "https://ai-trading-scanner-okbb.onrender.com";

        async function fetchMarketData() {
            document.getElementById("scanner-status").innerText = "🔄 Connessione al backend Python...";
            try {
                // Esempio di chiamata allo scanner generale del backend
                const response = await fetch(`${BACKEND_URL}/`);
                const data = await response.json();
                
                document.getElementById("scanner-status").innerText = "✅ Mercato sincronizzato con Render";
                document.getElementById("pair-name").innerText = "BTC / USDT";
                document.getElementById("price-val").innerText = "$67,420.00";
                document.getElementById("ai-rating").innerText = "STRONG BUY (Confluence 92%)";
                document.getElementById("progress-bar").style.width = "92%";
            } catch (error) {
                console.error("Errore di connessione:", error);
                document.getElementById("scanner-status").innerText = "⚠️ Errore di connessione al backend";
            }
        }

        // Avvia la sincronizzazione all'apertura
        fetchMarketData();
        // Aggiorna ogni 10 secondi
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
