<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Trading AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pair {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }
        .badge-group {
            display: flex;
            gap: 8px;
        }
        .badge-long {
            background-color: #059669;
            color: #ecfdf5;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-conf {
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 6px;
        }
        .status {
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Grafica Tachimetro SVG */
        .gauge-wrapper {
            position: relative;
            width: 220px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .gauge-center-text {
            position: absolute;
            bottom: 5px;
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #22c55e;
            letter-spacing: 1px;
        }
        
        /* Bar Progress */
        .bar-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bar-bg {
            background: #0f172a;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* Crypto Selector Grid */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .crypto-item {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .crypto-item.active {
            border-color: #3b82f6;
            background: #1e3a8a;
        }

        .btn-ai {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

    <!-- Scheda Prezzo -->
    <div class="card">
        <div class="header">
            <span id="pair-name" class="pair">BTC / USDT</span>
            <div class="badge-group">
                <span id="signal-badge" class="badge-long">▲ LONG</span>
                <span id="confluence-badge" class="badge-conf">Confluence: 92%</span>
            </div>
        </div>
        <div id="price-val" class="price">$67,420.00</div>
    </div>

    <!-- Scheda Status Connessione -->
    <div class="card" style="padding: 12px;">
        <div style="display:flex; align-items:center; gap:8px;">
            <span>🔍</span>
            <div>
                <div style="font-size:11px; color:#94a3b8; font-weight:bold;">SCANNER DI MERCATO IN TEMPO REALE</div>
                <div id="scanner-status" class="status">Sincronizzato con Backend Render</div>
            </div>
        </div>
    </div>

    <!-- Scheda Tachimetro (Gauge) -->
    <div class="card" style="text-align: center;">
        <div style="font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 8px;">TECHNICAL RATING (IA)</div>
        
        <div class="gauge-wrapper">
            <svg width="200" height="110" viewBox="0 0 200 110">
                <!-- Sfondo Arco Tachimetro -->
                <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
                <!-- Valore Arco Dinamico -->
                <path id="gauge-arc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="25"/>
                <!-- Pallino/Indicatore -->
                <circle id="gauge-dot" cx="160" cy="40" r="6" fill="#ffffff" />
            </svg>
            <div id="ai-rating-text" class="gauge-center-text">STRONG BUY</div>
        </div>
    </div>

    <!-- Scheda Trend Health & Entry Score -->
    <div class="card">
        <div class="bar-label">TREND HEALTH</div>
        <div class="bar-bg">
            <div id="trend-bar" class="bar-fill" style="width: 85%; background: #22c55e;"></div>
        </div>

        <div class="bar-label">ENTRY SCORE (IA SIGNAL)</div>
        <div class="bar-bg">
            <div id="entry-bar" class="bar-fill" style="width: 92%; background: #3b82f6;"></div>
        </div>
    </div>

    <!-- Selezione Criptovalute -->
    <div class="card">
        <div style="font-size:12px; color:#94a3b8; font-weight:bold; margin-bottom:6px;">MERCATO GLOBALE (SCANSIONE CONTINUA)</div>
        <div id="grid-container" class="crypto-grid"></div>
    </div>

    <button class="btn-ai" onclick="nextMarket()">ANALIZZA CON GEMINI AI</button>

    <script>
        const marketData = [
            { pair: "BTC / USDT", price: "$67,420.00", rating: "STRONG BUY", score: 92, trend: 88, type: "▲ LONG", color: "#22c55e" },
            { pair: "ETH / USDT", price: "$3,510.50", rating: "BUY", score: 84, trend: 80, type: "▲ LONG", color: "#22c55e" },
            { pair: "SOL / USDT", price: "$142.80", rating: "STRONG BUY", score: 96, trend: 94, type: "▲ LONG", color: "#22c55e" },
            { pair: "XRP / USDT", price: "$0.5420", rating: "NEUTRAL", score: 50, trend: 52, type: "◼ HOLD", color: "#eab308" },
            { pair: "UNI / USDT", price: "$7.2270", rating: "STRONG BUY", score: 85, trend: 75, type: "▲ LONG", color: "#22c55e" },
            { pair: "ADA / USDT", price: "$0.4510", rating: "BUY", score: 78, trend: 70, type: "▲ LONG", color: "#22c55e" }
        ];

        let currentIndex = 0;

        function updateGauge(score, ratingColor) {
            // Calcola l'offset per l'arco SVG del tachimetro (0-100 score)
            const maxOffset = 251;
            const offset = maxOffset - (maxOffset * (score / 100));
            const gaugeArc = document.getElementById("gauge-arc");
            gaugeArc.style.strokeDashoffset = offset;
            gaugeArc.style.stroke = ratingColor;

            // Calcolo posizione pallino lungo l'arco
            const angle = Math.PI * (1 - (score / 100));
            const cx = 100 + 80 * Math.cos(angle);
            const cy = 100 - 80 * Math.sin(angle);
            const dot = document.getElementById("gauge-dot");
            dot.setAttribute("cx", cx);
            dot.setAttribute("cy", cy);
        }

        function updateDisplay(index) {
            currentIndex = index;
            const item = marketData[currentIndex];

            document.getElementById("pair-name").innerText = item.pair;
            document.getElementById("price-val").innerText = item.price;
            document.getElementById("signal-badge").innerText = item.type;
            document.getElementById("confluence-badge").innerText = `Confluence: ${item.score}%`;
            
            const ratingText = document.getElementById("ai-rating-text");
            ratingText.innerText = item.rating;
            ratingText.style.color = item.color;

            document.getElementById("trend-bar").style.width = item.trend + "%";
            document.getElementById("entry-bar").style.width = item.score + "%";

            updateGauge(item.score, item.color);
            renderGrid();
        }

        function nextMarket() {
            currentIndex = (currentIndex + 1) % marketData.length;
            updateDisplay(currentIndex);
        }

        function renderGrid() {
            const grid = document.getElementById("grid-container");
            grid.innerHTML = "";
            marketData.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = `crypto-item ${idx === currentIndex ? 'active' : ''}`;
                div.innerHTML = `<span>${item.pair.split('/')[0]}</span> <span style="color:${item.color}">${item.score}%</span>`;
                div.onclick = () => updateDisplay(idx);
                grid.appendChild(div);
            });
        }

        // Avvio automatico con rotazione ogni 5 secondi
        updateDisplay(0);
        setInterval(nextMarket, 5000);
    </script>
</body>
</html>
