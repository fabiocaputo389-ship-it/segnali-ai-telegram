<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Trading AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pair {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }
        .badge-group {
            display: flex;
            gap: 6px;
        }
        .badge-long {
            background-color: #059669;
            color: #ecfdf5;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }
        .badge-conf {
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
        }
        .price {
            font-size: 26px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 4px;
        }
        
        /* Gauge Arc */
        .gauge-box {
            text-align: center;
            position: relative;
            padding-top: 6px;
        }
        .gauge-center-text {
            font-size: 20px;
            font-weight: 900;
            color: #22c55e;
            margin-top: -20px;
        }

        /* Progress Bars */
        .bar-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .bar-bg {
            background: #0f172a;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }

        /* Signal Cards (TP/SL/Leva) */
        .trade-signals-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .signal-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .signal-box-title {
            font-size: 10px;
            color: #94a3b8;
            font-weight: bold;
        }
        .signal-box-value {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 2px;
        }

        /* Crypto Grid */
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 6px;
        }
        .crypto-item {
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .crypto-item.active {
            border-color: #3b82f6;
            background: #1e3a8a;
        }

        .btn-ai {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="card">
        <div class="header">
            <span id="pair-name" class="pair">BTC / USDT</span>
            <div class="badge-group">
                <span id="signal-badge" class="badge-long">▲ LONG</span>
                <span id="confluence-badge" class="badge-conf">Confluence: 92%</span>
            </div>
        </div>
        <div id="price-val" class="price">$67,420.00</div>
    </div>

    <!-- Technical Rating -->
    <div class="card gauge-box">
        <div style="font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 6px;">TECHNICAL RATING (IA)</div>
        <svg width="180" height="95" viewBox="0 0 200 110">
            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
            <path id="gauge-arc" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="20"/>
        </svg>
        <div id="ai-rating-text" class="gauge-center-text">STRONG BUY</div>
    </div>

    <!-- Indicators -->
    <div class="card">
        <div class="bar-label">TREND HEALTH</div>
        <div class="bar-bg">
            <div id="trend-bar" class="bar-fill" style="width: 88%; background: #22c55e;"></div>
        </div>

        <div class="bar-label">ENTRY SCORE (IA SIGNAL)</div>
        <div class="bar-bg">
            <div id="entry-bar" class="bar-fill" style="width: 92%; background: #3b82f6;"></div>
        </div>
    </div>

    <!-- Levels -->
    <div class="card">
        <div style="font-size:11px; color:#94a3b8; font-weight:bold;">LIVELLI OPERATIVI CONSIGLIATI (IA)</div>
        <div class="trade-signals-grid">
            <div class="signal-box">
                <div class="signal-box-title">LEVA CONSIGLIATA</div>
                <div id="trade-leverage" class="signal-box-value" style="color: #f59e0b;">15x</div>
            </div>
            <div class="signal-box">
                <div class="signal-box-title">STOP LOSS (SL)</div>
                <div id="trade-sl" class="signal-box-value" style="color: #ef4444;">$65,100</div>
            </div>
            <div class="signal-box">
                <div class="signal-box-title">TAKE PROFIT 1</div>
                <div id="trade-tp1" class="signal-box-value" style="color: #22c55e;">$69,500</div>
            </div>
            <div class="signal-box">
                <div class="signal-box-title">TAKE PROFIT 2</div>
                <div id="trade-tp2" class="signal-box-value" style="color: #22c55e;">$71,800</div>
            </div>
        </div>
    </div>

    <!-- Market Selector Grid -->
    <div class="card">
        <div style="font-size:11px; color:#94a3b8; font-weight:bold;">MERCATO GLOBALE (SCANSIONE CONTINUA)</div>
        <div id="grid-container" class="crypto-grid"></div>
    </div>

    <button class="btn-ai" onclick="nextMarket()">ANALIZZA CON GEMINI AI</button>

    <script>
        var marketData = [
            { pair: "BTC / USDT", price: "$67,420.00", rating: "STRONG BUY", score: 92, trend: 88, type: "▲ LONG", color: "#22c55e", lev: "15x", sl: "$65,100", tp1: "$69,500", tp2: "$71,800" },
            { pair: "ETH / USDT", price: "$3,510.50", rating: "BUY", score: 84, trend: 80, type: "▲ LONG", color: "#22c55e", lev: "10x", sl: "$3,380", tp1: "$3,680", tp2: "$3,850" },
            { pair: "SOL / USDT", price: "$142.80", rating: "STRONG BUY", score: 96, trend: 94, type: "▲ LONG", color: "#22c55e", lev: "20x", sl: "$136.5", tp1: "$152.0", tp2: "$165.0" },
            { pair: "XRP / USDT", price: "$0.5420", rating: "NEUTRAL", score: 50, trend: 52, type: "◼ HOLD", color: "#eab308", lev: "5x", sl: "$0.515", tp1: "$0.580", tp2: "$0.610" },
            { pair: "UNI / USDT", price: "$7.2270", rating: "STRONG BUY", score: 85, trend: 75, type: "▲ LONG", color: "#22c55e", lev: "10x", sl: "$6.850", tp1: "$7.800", tp2: "$8.400" },
            { pair: "ADA / USDT", price: "$0.4510", rating: "BUY", score: 78, trend: 70, type: "▲ LONG", color: "#22c55e", lev: "10x", sl: "$0.428", tp1: "$0.490", tp2: "$0.530" },
            { pair: "DOGE / USDT", price: "$0.1245", rating: "STRONG BUY", score: 89, trend: 85, type: "▲ LONG", color: "#22c55e", lev: "20x", sl: "$0.115", tp1: "$0.138", tp2: "$0.155" },
            { pair: "AVAX / USDT", price: "$28.30", rating: "BUY", score: 81, trend: 76, type: "▲ LONG", color: "#22c55e", lev: "10x", sl: "$26.90", tp1: "$31.00", tp2: "$33.50" },
            { pair: "PEPE / USDT", price: "$0.0000098", rating: "STRONG BUY", score: 94, trend: 91, type: "▲ LONG", color: "#22c55e", lev: "25x", sl: "$0.0000090", tp1: "$0.0000115", tp2: "$0.0000130" },
            { pair: "NEAR / USDT", price: "$4.85", rating: "STRONG BUY", score: 87, trend: 83, type: "▲ LONG", color: "#22c55e", lev: "15x", sl: "$4.55", tp1: "$5.35", tp2: "$5.80" },
            { pair: "SUI / USDT", price: "$1.95", rating: "STRONG BUY", score: 95, trend: 92, type: "▲ LONG", color: "#22c55e", lev: "20x", sl: "$1.82", tp1: "$2.20", tp2: "$2.45" }
        ];

        var currentIndex = 0;

        function updateDisplay(idx) {
            currentIndex = idx;
            var item = marketData[currentIndex];

            document.getElementById("pair-name").innerText = item.pair;
            document.getElementById("price-val").innerText = item.price;
            document.getElementById("signal-badge").innerText = item.type;
            document.getElementById("confluence-badge").innerText = "Confluence: " + item.score + "%";

            var ratingEl = document.getElementById("ai-rating-text");
            ratingEl.innerText = item.rating;
            ratingEl.style.color = item.color;

            document.getElementById("trend-bar").style.width = item.trend + "%";
            document.getElementById("entry-bar").style.width = item.score + "%";

            document.getElementById("trade-leverage").innerText = item.lev;
            document.getElementById("trade-sl").innerText = item.sl;
            document.getElementById("trade-tp1").innerText = item.tp1;
            document.getElementById("trade-tp2").innerText = item.tp2;

            var gaugeArc = document.getElementById("gauge-arc");
            if (gaugeArc) {
                var offset = 251 - (251 * (item.score / 100));
                gaugeArc.style.strokeDashoffset = offset;
                gaugeArc.style.stroke = item.color;
            }

            renderGrid();
        }

        function nextMarket() {
            var nextIdx = (currentIndex + 1) % marketData.length;
            updateDisplay(nextIdx);
        }

        function renderGrid() {
            var grid = document.getElementById("grid-container");
            if (!grid) return;
            grid.innerHTML = "";
            for (var i = 0; i < marketData.length; i++) {
                (function(index) {
                    var item = marketData[index];
                    var div = document.createElement("div");
                    div.className = "crypto-item" + (index === currentIndex ? " active" : "");
                    div.innerHTML = "<span><b>" + item.pair.split('/')[0] + "</b></span> <span style='color:" + item.color + "; font-weight:bold;'>" + item.score + "%</span>";
                    div.onclick = function() { updateDisplay(index); };
                    grid.appendChild(div);
                })(i);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateDisplay(0);
            setInterval(nextMarket, 5000);
        });
    </script>
</body>
</html>
