    <script>
        const categories = {
            "Materie Prime": [
                { id: 'XAUUSD', label: '🥇 Oro', tv: 'FX:XAUUSD' },
                { id: 'XAGUSD', label: '🥈 Argento', tv: 'FX:XAGUSD' },
                { id: 'USOIL', label: '🛢️ Petrolio WTI', tv: 'TVC:USOIL' },
                { id: 'COPPER', label: '🥉 Rame', tv: 'COMEX:HG1!' },
                { id: 'NATGAS', label: '⚡ Gas Naturale', tv: 'NYMEX:NG1!' }
            ],
            "Crypto": [
                { id: 'BTCUSDT', label: '₿ Bitcoin', tv: 'BINANCE:BTCUSDT' },
                { id: 'ETHUSDT', label: 'Ξ Ethereum', tv: 'BINANCE:ETHUSDT' },
                { id: 'SOLUSDT', label: '🟣 Solana', tv: 'BINANCE:SOLUSDT' },
                { id: 'BNBUSDT', label: '🟡 BNB', tv: 'BINANCE:BNBUSDT' },
                { id: 'ADAUSDT', label: '₳ Cardano', tv: 'BINANCE:ADAUSDT' },
                { id: 'AVAXUSDT', label: '🔺 Avalanche', tv: 'BINANCE:AVAXUSDT' },
                { id: 'SUIUSDT', label: '💧 Sui', tv: 'BINANCE:SUIUSDT' },
                { id: 'NEARUSDT', label: '🌐 Near', tv: 'BINANCE:NEARUSDT' },
                { id: 'XRPUSDT', label: '✕ Ripple', tv: 'BINANCE:XRPUSDT' },
                { id: 'DOGEUSDT', label: '🐕 Doge (Meme)', tv: 'BINANCE:DOGEUSDT' },
                { id: 'SHIBUSDT', label: '🐶 Shiba (Meme)', tv: 'BINANCE:SHIBUSDT' },
                { id: 'PEPEUSDT', label: '🐸 Pepe (Meme)', tv: 'BINANCE:PEPEUSDT' },
                { id: 'BONKUSDT', label: '🦴 Bonk (Meme)', tv: 'BINANCE:BONKUSDT' },
                { id: 'WIFUSDT', label: '🐕‍🦺 WIF (Meme)', tv: 'BINANCE:WIFUSDT' },
                { id: 'LINKUSDT', label: '🔗 Chainlink', tv: 'BINANCE:LINKUSDT' },
                { id: 'UNIUSDT', label: '🦄 Uniswap', tv: 'BINANCE:UNIUSDT' }
            ],
            "Forex": [
                { id: 'EURUSD', label: '💶 EUR/USD', tv: 'FX:EURUSD' },
                { id: 'GBPUSD', label: '💷 GBP/USD', tv: 'FX:GBPUSD' },
                { id: 'USDJPY', label: '💴 USD/JPY', tv: 'FX:USDJPY' },
                { id: 'AUDUSD', label: '🇦🇺 AUD/USD', tv: 'FX:AUDUSD' },
                { id: 'USDCAD', label: '🇨🇦 USD/CAD', tv: 'FX:USDCAD' },
                { id: 'EURGBP', label: '🇪🇺 EUR/GBP', tv: 'FX:EURGBP' }
            ],
            "Indici": [
                { id: 'US500', label: '🇺🇸 S&P 500', tv: 'CAPITALCOM:US500' },
                { id: 'NAS100', label: '📈 Nasdaq 100', tv: 'CAPITALCOM:US100' },
                { id: 'US30', label: '🏛️ Dow Jones', tv: 'CAPITALCOM:US30' },
                { id: 'DAX40', label: '🇩🇪 DAX 40', tv: 'CAPITALCOM:DE40' },
                { id: 'FTSE100', label: '🇬🇧 FTSE 100', tv: 'CAPITALCOM:UK100' }
            ]
        };

        let currentCategory = 'Materie Prime';
        let currentSymbol = 'XAUUSD';
        let currentTimeframe = '15m';
        let currentMode = 'Day Trading';
        let liveInterval = null;

        function filterCategory(categoryName, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = categoryName;
            renderSymbols();
        }

        function renderSymbols() {
            const container = document.getElementById('symbol-selector');
            const assets = categories[currentCategory];
            container.innerHTML = assets.map((asset, index) => `
                <div class="chip ${index === 0 ? 'active' : ''}" onclick="setSymbol(this, '${asset.id}')">${asset.label}</div>
            `).join('');
            if(assets.length > 0) {
                setSymbol(container.children[0], assets[0].id);
            }
        }

        function initTradingView(symbol, tf) {
            const container = document.getElementById('tradingview_widget');
            container.innerHTML = '';
            
            let tvSymbol = 'FX:XAUUSD';
            for(let cat in categories) {
                const found = categories[cat].find(a => a.id === symbol);
                if(found) { tvSymbol = found.tv; break; }
            }

            const tfMap = { '1m': '1', '15m': '15', '30m': '30', '1h': '60' };

            new TradingView.widget({
                "autosize": true,
                "symbol": tvSymbol,
                "interval": tfMap[tf] || "15",
                "timezone": "Europe/Rome",
                "theme": "dark",
                "style": "1",
                "locale": "it",
                "toolbar_bg": "#121620",
                "enable_publishing": false,
                "container_id": "tradingview_widget"
            });
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');

            const titles = { 'analizza': 'Scanner Tutti i Mercati (LIVE)', 'segnali': 'Segnali Certi 🟢 LIVE', 'chat': 'Assistente AI', 'altro': 'Impostazioni' };
            document.getElementById('header-title').innerText = titles[tabId];

            // Gestione aggiornamento automatico in base alla scheda attiva
            if (liveInterval) clearInterval(liveInterval);

            if (tabId === 'segnali') {
                loadSignals();
                // Aggiorna automaticamente i segnali ogni 30 secondi in tempo reale
                liveInterval = setInterval(loadSignals, 30000);
            }
        }

        function setMode(el, mode) {
            document.querySelectorAll('#mode-selector .chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentMode = mode;
            if(document.getElementById('analysis-result').style.display === 'block') {
                runAnalysis(); // Aggiorna subito l'analisi se si cambia modalità
            }
        }

        function setSymbol(el, symbol) {
            document.querySelectorAll('#symbol-selector .chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentSymbol = symbol;
            initTradingView(currentSymbol, currentTimeframe);
            document.getElementById('analysis-result').style.display = 'none';
        }

        function setTimeframe(el, tf) {
            document.querySelectorAll('#tf-selector .chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentTimeframe = tf;
            initTradingView(currentSymbol, currentTimeframe);
        }

        async function runAnalysis() {
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: currentSymbol, timeframe: currentTimeframe, mode: currentMode })
                });
                const data = await response.json();
                
                document.getElementById('res-symbol').innerText = `${data.symbol} (${data.mode})`;
                document.getElementById('res-fav').innerText = `${data.favorability}%`;
                document.getElementById('res-risk').innerText = data.risk_level;
                
                const actionBadge = document.getElementById('res-action');
                actionBadge.innerText = data.action;
                actionBadge.className = `badge-action ${data.action}`;

                document.getElementById('res-entry').innerText = data.entry_zone;
                document.getElementById('res-sl').innerText = data.stop_loss;
                document.getElementById('res-tp1').innerText = data.take_profit_1;
                document.getElementById('res-tp2').innerText = data.take_profit_2;
                document.getElementById('res-tp3').innerText = data.take_profit_3;
                document.getElementById('res-comment').innerText = data.ai_comment;

                const logsContainer = document.getElementById('res-logs');
                logsContainer.innerHTML = data.fakeout_logs.map(log => `<li>${log}</li>`).join('');

                document.getElementById('analysis-result').style.display = 'block';
            } catch (err) {
                console.error('Errore durante l\'analisi live:', err);
            }
        }

        async function loadSignals() {
            try {
                const res = await fetch('/api/signals');
                const signals = await res.json();
                const container = document.getElementById('signals-container');
                
                const grouped = {};
                signals.forEach(s => {
                    if(!grouped[s.category]) grouped[s.category] = [];
                    grouped[s.category].push(s);
                });

                let html = '<div style="font-size:11px; color:#0ecb81; margin-bottom:10px; text-align:right;">🟢 Aggiornato in tempo reale</div>';
                for(let cat in grouped) {
                    html += `<div class="category-title">${cat}</div>`;
                    html += grouped[cat].map(s => `
                        <div class="signal-card">
                            <div class="signal-header">
                                <div>
                                    <h4 style="font-size: 15px;">${s.name}</h4>
                                    <p style="font-size: 12px; color: #848e9c;">Prezzo: ${s.price} • ${s.change}</p>
                                </div>
                                <div class="badge-action ${s.action}">${s.action}</div>
                            </div>
                            <div style="font-size: 12px; color: #00b8d9; margin-bottom: 4px;">
                                <strong>Entrata:</strong> ${s.entry}
                            </div>
                            <div class="signal-details">
                                <span style="color: #f6465d;"><strong>SL:</strong> ${s.sl}</span>
                                <span style="color: #0ecb81;"><strong>TP1:</strong> ${s.tp1}</span>
                                <span style="color: #0ecb81;"><strong>TP2:</strong> ${s.tp2}</span>
                                <span style="color: #0ecb81;"><strong>TP3:</strong> ${s.tp3}</span>
                            </div>
                            <div style="font-size: 11px; color: #848e9c; margin-top: 6px; border-top: 1px solid #1f2633; padding-top: 4px;">
                                RSI: <span style="color:#fff;">${s.rsi}</span> | MACD: <span style="color:#fff;">${s.macd}</span> | Affidabilità: <strong style="color:#0ecb81;">${s.prob}</strong>
                            </div>
                        </div>
                    `).join('');
                }
                container.innerHTML = html || '<p style="color:#848e9c;">Nessun segnale nel range 90%-100% al momento.</p>';
            } catch (e) {
                console.error('Errore caricamento segnali live:', e);
            }
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<p style="background: #232d3f; padding: 10px; border-radius: 8px; margin-bottom: 8px; text-align: right;">${input.value}</p>`;
            const val = input.value;
            input.value = '';
            setTimeout(() => {
                chat.innerHTML += `<p style="background: #181f2a; padding: 10px; border-radius: 8px; margin-bottom: 8px;">Analisi live completata su "${val}": dati di mercato sincronizzati in tempo reale.</p>`;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }

        window.onload = () => {
            renderSymbols();
        };
    </script>
