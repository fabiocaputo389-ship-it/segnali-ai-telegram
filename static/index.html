<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexScan Pro • Black &amp; Gold Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: { 950: '#050506', 900: '#0C0C0F', 850: '#101014', 800: '#141418', 700: '#1E1E24' },
            gold: { 300: '#F9E08B', 400: '#F3D066', 500: '#D4AF37', 600: '#AA8A26', 700: '#7D6319' },
            emeraldNeon: '#00FF66',
            rubyNeon: '#FF334B'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050506; color: #f4f1ea; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050506; }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.35); border-radius: 9999px; }
    @keyframes goldPulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(212, 175, 55, 0.35), inset 0 0 8px rgba(243, 208, 102, 0.2); }
      50% { box-shadow: 0 0 22px rgba(243, 208, 102, 0.8), inset 0 0 12px rgba(243, 208, 102, 0.4); }
    }
    .terminal-card { background: linear-gradient(180deg, rgba(16, 16, 20, 0.97) 0%, rgba(12, 12, 15, 0.99) 100%); border: 1px solid rgba(212, 175, 55, 0.25); }
    .master-enter-section { background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.14), rgba(12, 12, 15, 0.98) 65%); border: 1.5px solid rgba(212, 175, 55, 0.55); }
    .gold-gradient-btn { background: linear-gradient(135deg, #D4AF37 0%, #F3D066 50%, #C59B27 100%); color: #050506; font-weight: 800; }
    .enter-now-badge { background: linear-gradient(135deg, #D4AF37 0%, #F3D066 55%, #00FF66 140%); color: #050506; animation: goldPulseGlow 1.8s infinite ease-in-out; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-30 bg-[#050506]/95 backdrop-blur-md border-b border-gold-500/25 px-3 sm:px-5 py-2.5">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#F3D066] via-[#D4AF37] to-[#7D6319] flex items-center justify-center border border-gold-300/50">
          <svg class="w-5 h-5 text-[#050506]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/><circle cx="19" cy="9" r="2" fill="currentColor"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-extrabold text-white">ApexScan <span class="text-gold-400">Pro</span></h1>
            <span class="px-2 py-0.5 rounded-md text-[10px] font-mono font-bold bg-gold-500/15 text-gold-300 border border-gold-500/40">BLACK &amp; GOLD EDITION</span>
          </div>
          <div class="flex items-center gap-2 text-[11px] font-mono text-slate-400 mt-0.5">
            <span id="liveCetClock" class="text-gold-300 font-semibold tabular-nums">--:--:-- CET</span>
            <span class="text-gold-500/50">•</span>
            <span id="activeMarketSessionBadge" class="text-slate-300 font-medium">Killzone Londra (09:00 - 12:30 CET)</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center bg-[#0C0C0F] border border-gold-500/35 rounded-xl p-0.5">
          <button id="audioToggleBtn" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-gold-500/20 text-gold-300">🔊 Audio ON</button>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#00FF66]/10 text-[#00FF66] border border-[#00FF66]/40">
          <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00FF66] opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-[#00FF66]"></span></span>
          <span>Live Attivo</span>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1920px] w-full mx-auto px-3 sm:px-5 py-4 flex flex-col gap-4">
    <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
      <div class="terminal-card rounded-2xl p-3.5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-gold-400">
          <span>Segnali Entra Adesso</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-gold-500/15 text-gold-300 border border-gold-500/35">KILLZONE LIVE</span>
        </div>
        <div class="mt-2 flex items-baseline justify-between">
          <div class="flex items-baseline gap-2">
            <span class="text-2xl font-extrabold font-mono text-gold-300">6</span>
            <span class="text-xs font-mono text-[#00FF66] font-semibold">pronti ora</span>
          </div>
          <span class="text-xs font-mono text-slate-400">su 24 asset</span>
        </div>
      </div>

      <div class="terminal-card rounded-2xl p-3.5 flex flex-col justify-between">
        <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-gold-400">
          <span>Sentiment Globale Preciso</span>
          <span id="kpiGlobalSentimentLabel" class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-[#00FF66]/15 text-[#00FF66] border border-[#00FF66]/35">71% BULLISH</span>
        </div>
        <div class="mt-2">
          <div class="w-full h-2 bg-[#1E1E24] rounded-full overflow-hidden flex mb-1.5 border border-gold-500/20">
            <div id="kpiGlobalSentimentBar" class="h-full bg-gradient-to-r from-[#D4AF37] via-[#F3D066] to-[#00FF66] transition-all duration-500" style="width: 71%"></div>
          </div>
          <div class="flex items-center justify-between text-[10px] font-mono text-slate-300">
            <span id="kpiFearGreedText">F&amp;G: <strong class="text-gold-300">71 (Greed)</strong></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Sincronizzazione orologio e WebSocket sicuro WSS per Render
    function updateClock() {
      const now = new Date();
      document.getElementById('liveCetClock').textContent = now.toTimeString().slice(0, 8) + " CET";
    }
    setInterval(updateClock, 1000);
    updateClock();

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/ws`;

    function connectWebSocket() {
      const socket = new WebSocket(wsUrl);
      
      socket.onopen = function() {
        console.log("WebSocket connesso con successo al server Python!");
      };

      socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if(data.type === 'MARKET_TICK') {
          console.log("Dati live ricevuti dal server:", data);
          if(data.timestamp) {
            document.getElementById('liveCetClock').textContent = data.timestamp + " CET";
          }
          if(data.fear_greed_val) {
            document.getElementById('kpiFearGreedText').innerHTML = `F&amp;G: <strong class="text-gold-300">${data.fear_greed_val} (${data.fear_greed_text})</strong>`;
          }
        }
      };

      socket.onclose = function() {
        console.log("Connessione WebSocket chiusa. Tentativo di riconnessione tra 3 secondi...");
        setTimeout(connectWebSocket, 3000);
      };

      socket.onerror = function(error) {
        console.error("Errore WebSocket:", error);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>
