# Blueprint Render per Super Scanner. Solo libreria standard di Python: nessuna dipendenza da installare.
#
# PIANO: senza "plan" Render usa l'istanza a pagamento di base, l'unica che resta accesa 24/7 e che può avere un disco
# persistente (per conservare il track record). Per provare gratis metti "plan: free" e cancella il blocco "disk":
# sul piano gratuito il servizio si sospende dopo 15 minuti senza visite e lo storico si azzera a ogni riavvio.
services:
  - type: web
    name: super-scanner
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATA_DIR
        value: /var/data
      - key: DASH_PASSWORD      # password della dashboard (utente: admin)
        sync: false
      - key: ANTHROPIC_API_KEY  # opzionale: verifica AI dei segnali
        sync: false
      - key: TELEGRAM_TOKEN     # opzionale
        sync: false
      - key: TELEGRAM_CHAT_ID   # opzionale
        sync: false
    disk:
      name: scanner-data
      mountPath: /var/data
      sizeGB: 1
